<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AFA Genetics</title>

  <style>
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      text-align: center;
    }

    header { padding: 30px 16px 15px; }

    h1 {
      color: #39ff14;
      font-size: 2.6rem;
      margin: 0;
      text-shadow: 0 0 14px #39ff14;
    }

    .tagline { color: #ccc; margin-top: 8px; font-size: 1rem; }

    .nav {
      padding: 12px;
      position: sticky;
      top: 0;
      background: #000;
      z-index: 10;
      border-bottom: 1px solid #143b14;
    }

    .nav a, .letter-btn, .clear-btn {
      display: inline-block;
      color: #fff;
      border: 1px solid #39ff14;
      border-radius: 999px;
      padding: 9px 13px;
      margin: 5px;
      text-decoration: none;
      box-shadow: 0 0 8px #39ff14;
      font-weight: bold;
      font-size: 0.9rem;
      background: #000;
      cursor: pointer;
    }

    .letter-btn.active {
      background: #39ff14;
      color: #000;
    }

    section { padding: 22px 14px; }

    h2 {
      color: #39ff14;
      font-size: 2rem;
      margin: 20px 0;
      text-shadow: 0 0 10px #39ff14;
    }

    .search-card, .order-card {
      max-width: 720px;
      margin: 14px auto;
      padding: 18px;
      border: 2px solid #39ff14;
      border-radius: 18px;
      background: #050505;
      box-shadow: 0 0 12px #39ff14;
    }

    #searchInput {
      width: calc(100% - 28px);
      padding: 14px;
      border-radius: 12px;
      border: 2px solid #39ff14;
      background: #000;
      color: #fff;
      font-size: 1rem;
    }

    .result-count {
      color: #aaa;
      margin-top: 10px;
    }

    .strain-card {
      max-width: 720px;
      margin: 14px auto;
      border: 2px solid #39ff14;
      border-radius: 18px;
      background: #050505;
      box-shadow: 0 0 12px #39ff14;
      overflow: hidden;
      text-align: left;
    }

    .strain-img {
      width: 100%;
      display: block;
      border-bottom: 1px solid #145214;
    }

    .strain-button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #fff;
      padding: 18px;
      font-size: 1.15rem;
      font-weight: bold;
      text-align: left;
      cursor: pointer;
    }

    .strain-button span {
      color: #39ff14;
      float: right;
    }

    .strain-details {
      display: none;
      padding: 0 18px 18px;
      color: #ddd;
      border-top: 1px solid #145214;
    }

    .label {
      color: #39ff14;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>AFA Genetics</h1>
  <div class="tagline">Auto / Fem seed catalog</div>
</header>

<section id="search">
  <h2>Search Catalog</h2>

  <div class="search-card">
    <input id="searchInput" type="text" placeholder="Search anything..." />
    <div id="letterFilters"></div>
    <button class="clear-btn" id="clearFilters">Clear</button>
    <div class="result-count" id="resultCount"></div>
  </div>
</section>

<section>
  <div id="autoFemList"></div>
</section>

<script type="module">
import strains from "./data/strains.js";
import strainImages from "./data/strainImages.js";

const autoFemList = document.getElementById("autoFemList");
const searchInput = document.getElementById("searchInput");
const letterFilters = document.getElementById("letterFilters");
const clearFilters = document.getElementById("clearFilters");
const resultCount = document.getElementById("resultCount");

/* 🔥 PERSIST STATE */
const savedSearch = localStorage.getItem("afaSearch") || "";
const savedLetter = localStorage.getItem("afaLetter") || "All";

let activeLetter = savedLetter;
searchInput.value = savedSearch;

/* Alphabet */
const alphabet = ["All", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];

letterFilters.innerHTML = alphabet
  .map(letter => `<button class="letter-btn" data-letter="${letter}">${letter}</button>`)
  .join("");

function field(label, value) {
  if (!value) return "";
  return `<p><span class="label">${label}:</span> ${value}</p>`;
}

/* 🔥 IMAGE + RENDER */
function renderStrain(strain) {
  const image = strainImages[strain.name];

  return `
    <div class="strain-card">
      ${image ? `<img src="${image}" class="strain-img">` : ""}

      <button class="strain-button">
        ${strain.name}
        <span>+</span>
      </button>

      <div class="strain-details">
        ${field("Type", strain.type)}
        ${field("Lineage", strain.lineage)}
        ${field("THC", strain.thc)}
        ${field("Flavor", strain.flavor)}
      </div>
    </div>
  `;
}

function searchableText(strain) {
  return Object.values(strain).join(" ").toLowerCase();
}

function filterList(list) {
  const query = searchInput.value.toLowerCase();

  return list.filter(strain => {
    const matchesSearch = !query || searchableText(strain).includes(query);
    const matchesLetter = activeLetter === "All" || strain.name.startsWith(activeLetter);
    return matchesSearch && matchesLetter;
  });
}

function bindClicks() {
  document.querySelectorAll(".strain-button").forEach(btn => {
    btn.onclick = () => {
      const details = btn.nextElementSibling;
      details.style.display = details.style.display === "block" ? "none" : "block";
    };
  });
}

function updateActiveButton() {
  document.querySelectorAll(".letter-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.letter === activeLetter);
  });
}

function renderAll() {
  const filtered = filterList(strains.autoFem || []);

  autoFemList.innerHTML = filtered.map(renderStrain).join("");

  resultCount.textContent = `Showing ${filtered.length} results`;

  updateActiveButton();
  bindClicks();
}

/* 🔥 SAVE STATE ON CHANGE */
searchInput.addEventListener("input", () => {
  activeLetter = "All";
  localStorage.setItem("afaSearch", searchInput.value);
  localStorage.setItem("afaLetter", activeLetter);
  renderAll();
});

letterFilters.addEventListener("click", e => {
  if (!e.target.matches(".letter-btn")) return;

  activeLetter = e.target.dataset.letter;
  localStorage.setItem("afaLetter", activeLetter);
  renderAll();
});

clearFilters.onclick = () => {
  searchInput.value = "";
  activeLetter = "All";
  localStorage.removeItem("afaSearch");
  localStorage.removeItem("afaLetter");
  renderAll();
};

renderAll();
</script>

</body>
</html>
